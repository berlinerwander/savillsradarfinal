services:
  - type: web
    name: savills-radar
    runtime: node
    plan: free            # switch to "starter" to avoid cold starts before the demo
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # set in Render dashboard — never commit
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NODE_VERSION
        value: "22"
